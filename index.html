<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任務計時器</title>
<style>
  :root {
    --accent: #ff6a3d;
    --accent-dim: #7a3620;
    --gray: #9aa4b2;
    --gray-dim: #4a5563;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #05070c;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
  }
  canvas#bg {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    z-index: 0;
  }
  .wrap {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(28px, 5vh, 56px);
    padding: 24px;
    width: min(720px, 92vw);
  }
  .timer {
    font-family: "SF Mono", "Menlo", "Consolas", "Courier New", monospace;
    font-weight: 600;
    font-size: clamp(4.2rem, 16vw, 9rem);
    letter-spacing: 0.04em;
    color: #eef2f8;
    text-align: center;
    line-height: 1;
    text-shadow: 0 0 40px rgba(120, 170, 255, 0.25);
    font-variant-numeric: tabular-nums;
    user-select: none;
  }
  .timer.warn { color: var(--accent); }

  .timer-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .sun-info {
    font-family: "SF Mono", "Menlo", "Consolas", "Courier New", monospace;
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    color: var(--gray);
    text-align: center;
    user-select: none;
  }

  .progress-container {
    position: relative;
    width: 100%;
    padding-top: 18px;
  }
  .progress-track {
    position: relative;
    width: 100%;
    height: 2px;
    border-radius: 1px;
    background: rgba(255, 255, 255, 0.28);
    overflow: visible;
  }
  .progress-fill {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    width: 0%;
    border-radius: 1px;
    background: var(--accent);
    transition: width 0.4s linear;
  }
  .rocket {
    position: absolute;
    top: 50%;
    left: 0%;
    width: 30px;
    height: 14px;
    transform: translate(-50%, -50%);
    transition: left 0.4s linear;
    filter: drop-shadow(0 0 6px rgba(255, 140, 90, 0.7));
    user-select: none;
  }
  .rocket-icon { display: block; width: 100%; height: 100%; overflow: visible; }
  .rocket-icon .rk-flame  { fill: #ffb347; }
  .rocket-icon .rk-body   { fill: var(--accent); }
  .rocket-icon .rk-fin    { fill: var(--gray); }
  .rocket-icon .rk-window-outer { fill: #0b0f16; }
  .rocket-icon .rk-window-inner { fill: #bfe3ff; }

  .controls {
    display: flex;
    gap: 14px;
    width: 100%;
    justify-content: center;
  }
  button {
    font-family: inherit;
    font-size: 0.95rem;
    letter-spacing: 0.08em;
    font-weight: 600;
    padding: 14px 28px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.04);
    color: var(--gray);
    cursor: pointer;
    min-width: 108px;
    transition: all 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  button:hover:not(:disabled) {
    color: #e6e9ef;
    border-color: rgba(255, 255, 255, 0.3);
    background: rgba(255, 255, 255, 0.08);
  }
  button:active:not(:disabled) {
    transform: scale(0.96);
  }
  button:disabled {
    opacity: 0.35;
    cursor: default;
  }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #1a0d06;
    box-shadow: 0 0 24px rgba(255, 106, 61, 0.45);
  }
  button.primary:hover:not(:disabled) {
    background: #ff7c53;
    color: #1a0d06;
  }
  button.primary:disabled {
    background: var(--accent-dim);
    border-color: var(--accent-dim);
    box-shadow: none;
    color: rgba(255,255,255,0.4);
    opacity: 1;
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="wrap">
  <div class="timer-block">
    <div class="timer" id="timerDisplay">25:00</div>
    <div class="sun-info" id="sunInfo">取得中…</div>
  </div>

  <div class="progress-container">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
      <div class="rocket" id="rocket">
        <svg class="rocket-icon" viewBox="0 0 44 20" xmlns="http://www.w3.org/2000/svg">
          <path class="rk-flame" d="M2 10 L9 6 L9 14 Z"/>
          <path class="rk-body" d="M9 10 C9 5 17 3 25 3 C33 3 41 6 43 10 C41 14 33 17 25 17 C17 17 9 15 9 10 Z"/>
          <path class="rk-fin" d="M13 5 L6 1 L14 7 Z"/>
          <path class="rk-fin" d="M13 15 L6 19 L14 13 Z"/>
          <circle class="rk-window-outer" cx="28" cy="10" r="3.2"/>
          <circle class="rk-window-inner" cx="28" cy="10" r="1.7"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="primary" id="btnLaunch">發射</button>
    <button id="btnStandby" disabled>待機</button>
    <button id="btnReturn">返航</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ---------------------------------------------------------
   * 背景：軌道視角星球
   * --------------------------------------------------------- */
  var canvas = document.getElementById('bg');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  // 固定亂數種子，星星座標只算一次，重繪時不會跳動
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = mulberry32(20260809);
  var STAR_COUNT = 260;
  var STARS = [];
  for (var i = 0; i < STAR_COUNT; i++) {
    STARS.push({
      x: rand(),                 // 相對座標 0-1，隨畫布縮放不跳動
      y: rand() * 0.82,
      r: 0.4 + rand() * 1.4,
      a: 0.25 + rand() * 0.65,
      tw: rand() * Math.PI * 2   // 各自固定的閃爍相位
    });
  }

  function normalize(v) {
    var len = Math.sqrt(v[0]*v[0] + v[1]*v[1] + v[2]*v[2]);
    return [v[0]/len, v[1]/len, v[2]/len];
  }
  function dot3(a, b) { return a[0]*b[0] + a[1]*b[1] + a[2]*b[2]; }

  var LIGHT_DIR = normalize([-0.62, 0.6, 0.55]); // 左上光源

  // 星球表面粒子：經緯線網格排列（固定寫死，重繪時不會跳動）
  var randPlanet = mulberry32(778899);
  var LAT_STEP = 2.4; // 緯線間距（度）
  var LON_STEP = 2.6; // 經線間距（度）
  var PLANET_POINTS = [];
  for (var lat = -90; lat <= 90; lat += LAT_STEP) {
    var latRad = lat * Math.PI / 180;
    var cosLat = Math.cos(latRad);
    var sinLat = Math.sin(latRad);
    for (var lon = 0; lon < 360; lon += LON_STEP) {
      var lonRad = lon * Math.PI / 180;
      var nx = cosLat * Math.sin(lonRad);
      var ny = sinLat;
      var nz = cosLat * Math.cos(lonRad);
      PLANET_POINTS.push({
        nx: nx, ny: ny, nz: nz,
        sizeJ: 0.75 + randPlanet() * 0.35,
        alphaJ: 0.7 + randPlanet() * 0.3,
        escapeSeed: randPlanet()  // 是否成為邊緣逃逸粒子
      });
    }
  }

  var planetGeom = null; // { R, cx, cy }

  function computeGeom() {
    var R = Math.max(W, H) * 0.62;
    var cx = W / 2;
    var cy = H + R * 0.5;
    planetGeom = { R: R, cx: cx, cy: cy };
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    computeGeom();
    render();
  }

  function drawSky() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#02030a');
    g.addColorStop(0.6, '#050914');
    g.addColorStop(1, '#0a1120');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    for (var i = 0; i < STARS.length; i++) {
      var s = STARS[i];
      var px = s.x * W;
      var py = s.y * H;
      ctx.beginPath();
      ctx.fillStyle = 'rgba(255,255,255,' + s.a + ')';
      ctx.arc(px, py, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawPlanet() {
    var R = planetGeom.R, cx = planetGeom.cx, cy = planetGeom.cy;

    // 星球實體（先鋪暗底，遮住背後星星）
    ctx.beginPath();
    ctx.fillStyle = '#03060c';
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fill();

    for (var i = 0; i < PLANET_POINTS.length; i++) {
      var p = PLANET_POINTS[i];
      var x = p.nx, y = p.ny, z = p.nz;

      if (z <= 0.01) continue; // 背向鏡頭，跳過

      var rim = Math.pow(1 - z, 3); // 越靠輪廓越亮的邊緣光

      // 貼近輪廓的粒子有機率往外逃逸擴散，做出邊緣毛邊感
      var edgeBoost = 0;
      if (z < 0.26 && p.escapeSeed < 0.22) {
        edgeBoost = (p.escapeSeed / 0.22) * R * 0.05;
      }
      var radius = R + edgeBoost;

      var px = cx + x * radius;
      var py = cy - y * radius;
      if (py < -8 || py > H + 8) continue; // 畫面外，跳過

      var lambert = Math.max(0, dot3([x, y, z], LIGHT_DIR)); // 日照面
      var brightness = Math.min(1, lambert * 0.95 + rim * 0.4 + 0.02);

      var r = 20 + brightness * 200;
      var gCol = 55 + brightness * 175;
      var b = 100 + brightness * 135;
      var alpha = (0.1 + brightness * 0.75) * p.alphaJ * (edgeBoost > 0 ? 0.5 : 1);
      var size = (0.5 + brightness * 1.1) * p.sizeJ;

      ctx.beginPath();
      ctx.fillStyle = 'rgba(' + (r|0) + ',' + (gCol|0) + ',' + (b|0) + ',' + alpha.toFixed(2) + ')';
      ctx.arc(px, py, size, 0, Math.PI * 2);
      ctx.fill();
    }

    // 大氣輝光（貼著輪廓的薄薄一圈）
    var glow = ctx.createRadialGradient(cx, cy, R * 1.0, cx, cy, R * 1.055);
    glow.addColorStop(0, 'rgba(140,195,255,0.55)');
    glow.addColorStop(0.6, 'rgba(110,170,255,0.2)');
    glow.addColorStop(1, 'rgba(110,170,255,0)');
    ctx.beginPath();
    ctx.fillStyle = glow;
    ctx.arc(cx, cy, R * 1.055, 0, Math.PI * 2);
    ctx.fill();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawSky();
    drawPlanet();
  }

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 120);
  });

  resize();

  /* ---------------------------------------------------------
   * 計時器
   * --------------------------------------------------------- */
  var TOTAL = 25 * 60;
  var remaining = TOTAL;
  var timerId = null;
  var running = false;

  var timerDisplay = document.getElementById('timerDisplay');
  var progressFill = document.getElementById('progressFill');
  var rocket = document.getElementById('rocket');
  var btnLaunch = document.getElementById('btnLaunch');
  var btnStandby = document.getElementById('btnStandby');
  var btnReturn = document.getElementById('btnReturn');

  function format(sec) {
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  function updateDisplay() {
    timerDisplay.textContent = format(remaining);
    timerDisplay.classList.toggle('warn', remaining <= 60 && remaining > 0);

    var pct = ((TOTAL - remaining) / TOTAL) * 100;
    progressFill.style.width = pct + '%';
    rocket.style.left = pct + '%';
  }

  function setButtons() {
    btnLaunch.disabled = running;
    btnStandby.disabled = !running;
  }

  function tick() {
    remaining -= 1;
    if (remaining <= 0) {
      remaining = 0;
      updateDisplay();
      stopTimer();
      return;
    }
    updateDisplay();
  }

  function startTimer() {
    if (running || remaining <= 0) return;
    running = true;
    timerId = setInterval(tick, 1000);
    setButtons();
  }

  function stopTimer() {
    running = false;
    clearInterval(timerId);
    timerId = null;
    setButtons();
  }

  function resetTimer() {
    stopTimer();
    remaining = TOTAL;
    updateDisplay();
  }

  btnLaunch.addEventListener('click', startTimer);
  btnStandby.addEventListener('click', stopTimer);
  btnReturn.addEventListener('click', resetTimer);

  updateDisplay();
  setButtons();

  /* ---------------------------------------------------------
   * 台北日出日落
   * --------------------------------------------------------- */
  var sunInfo = document.getElementById('sunInfo');
  var SUN_API = 'https://api.open-meteo.com/v1/forecast?latitude=25.03&longitude=121.56&daily=sunrise,sunset&timezone=Asia/Taipei&forecast_days=1';

  function extractHM(iso) {
    var t = iso && iso.split('T')[1];
    return t ? t.slice(0, 5) : '';
  }

  function loadSunInfo() {
    var controller = ('AbortController' in window) ? new AbortController() : null;
    var timeoutId = controller ? setTimeout(function () { controller.abort(); }, 8000) : null;

    fetch(SUN_API, controller ? { signal: controller.signal } : {})
      .then(function (res) {
        if (!res.ok) throw new Error('bad status');
        return res.json();
      })
      .then(function (data) {
        var sunrise = data && data.daily && data.daily.sunrise && data.daily.sunrise[0];
        var sunset = data && data.daily && data.daily.sunset && data.daily.sunset[0];
        var hmRise = extractHM(sunrise);
        var hmSet = extractHM(sunset);
        if (!hmRise || !hmSet) throw new Error('missing data');
        sunInfo.textContent = '日出 ' + hmRise + ' ／ 日落 ' + hmSet;
      })
      .catch(function () {
        sunInfo.textContent = '離線';
      })
      .then(function () {
        if (timeoutId) clearTimeout(timeoutId);
      });
  }

  loadSunInfo();
})();
</script>

</body>
</html>
